<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5×2">
<title>Déficit 5×2</title>
<style>
:root{--bg:#0a0e14;--s1:#121923;--s2:#192232;--s3:#243145;--tx:#e9eef6;--mu:#8c9bb0;--bd:#232f42;--acc:#34d399;--ink:#04140d;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--blue:#60a5fa;--vio:#a78bfa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
summary{cursor:pointer;font-weight:700}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(96px + env(safe-area-inset-bottom,0px))}
.muted{color:var(--mu)}
small{color:var(--mu);font-size:12px}
h2{margin:6px 0 12px;font-size:21px;letter-spacing:-.01em}
h3{margin:0 0 10px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--mu);display:flex;justify-content:space-between;align-items:center}
p{margin:0 0 10px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:14px;margin-bottom:12px}
.sec{margin:20px 0 12px}
.foot{color:var(--mu);font-size:13px;text-align:center;margin:8px 0 0}
.lnk{color:var(--acc);font-weight:700;font-size:13px;text-transform:none;letter-spacing:0}
.btn{min-height:52px;padding:0 18px;border-radius:16px;background:var(--s2);border:1px solid var(--bd);font-weight:700;transition:transform .08s,filter .15s}
.btn:active,.chip:active,.rb:active,.sd:active,.medal:active{transform:scale(.95)}
.btn.pri{background:var(--acc);border-color:transparent;color:var(--ink)}
.btn.dng{background:rgba(251,113,133,.13);border-color:rgba(251,113,133,.4);color:var(--bad)}
.btn.big{width:100%;min-height:58px;font-size:18px;margin-top:6px}
.btn[disabled],.rb[disabled]{opacity:.35;pointer-events:none}
.btns{display:flex;gap:10px;margin-top:8px}.btns .btn{flex:1}
.bar{height:10px;background:var(--s3);border-radius:99px;overflow:hidden;position:relative}
.bar.thin{height:6px}.bar.big{height:16px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.bar i.gh{opacity:.35}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}
.t-ok{color:var(--acc)}.t-warn{color:var(--warn)}.t-bad{color:var(--bad)}
/* HUD */
.hud{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:linear-gradient(135deg,var(--s1),var(--s2));border:1px solid var(--bd);border-radius:20px;padding:10px 14px;margin-bottom:12px}
.lvb{width:46px;height:46px;border-radius:15px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-weight:900;font-size:21px;flex:none;box-shadow:0 0 0 4px rgba(255,255,255,.04)}
.hm{flex:1;min-width:0}.ht{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:7px}
.hs{display:flex;flex-direction:column;align-items:center;line-height:1.05;gap:1px;font-size:20px}.hs b{font-size:18px}
.bn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:12px;position:relative;padding-right:34px}
.bn.bad{background:rgba(251,113,133,.1);border-color:rgba(251,113,133,.4)}
.bn i{position:absolute;right:8px;top:6px;width:26px;height:26px;display:grid;place-items:center;font-style:normal;font-size:18px;color:var(--mu)}
/* strip */
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:10px}
.sd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:16px;background:var(--s1);border:1px solid var(--bd);min-height:80px;transition:transform .1s,background .2s}
.sd.sel{background:var(--s3);border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sd .sl{font-size:11px;color:var(--mu);font-weight:700}.sd .sn{font-size:17px;font-weight:800}
.sd .sg{font-size:13px;height:16px;line-height:16px;font-weight:800}
.sd .st{font-size:10px;font-weight:800;border-radius:6px;padding:1px 6px;background:rgba(96,165,250,.16);color:var(--blue)}
.sd .st.M{background:rgba(167,139,250,.16);color:var(--vio)}
.sd.tod .sn{color:var(--acc)}
.g-ok{color:var(--ok)}.g-near,.g-low{color:var(--warn)}.g-miss{color:var(--bad)}.g-live{color:var(--acc);animation:pulse 1.4s infinite}.g-none,.g-empty{color:var(--mu)}
@keyframes pulse{50%{opacity:.3}}
/* mini week */
.wmini{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.wm{flex:1;text-align:left}.wt{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);margin-bottom:6px}.wt b{color:var(--tx);font-size:13px}
/* day header */
.dayhd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 10px}
.dt{font-size:22px;font-weight:800;letter-spacing:-.01em}.dt small{font-size:14px;font-weight:600}
.ds{font-size:13px;color:var(--mu)}
.tpill{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:0 14px;border-radius:99px;font-weight:800;font-size:14px;background:rgba(96,165,250,.14);color:var(--blue);border:1px solid rgba(96,165,250,.35)}
.tpill span{opacity:.7}
.tpill.M{background:rgba(167,139,250,.14);color:var(--vio);border-color:rgba(167,139,250,.35)}
.tpill.sm{min-height:36px;min-width:42px;justify-content:center;padding:0 10px}
/* hero ring */
.hero{text-align:center;padding:16px 14px 14px}
.ringwrap{position:relative;width:212px;height:212px;margin:0 auto 8px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.rg-bg{stroke:var(--s3)}
.rg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1),stroke .3s}
.rg.warn{stroke:var(--warn)}.rg.bad{stroke:var(--bad)}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rl{font-size:13px;color:var(--mu);font-weight:600}.ru{font-size:13px;color:var(--mu)}
.rn{font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1.02;font-variant-numeric:tabular-nums}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 10px}
.stats3 div{background:var(--s2);border-radius:14px;padding:9px 4px}.stats3 b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.goalline{font-size:13px;color:var(--mu);margin-bottom:6px}
.hint{font-size:14px;font-weight:600}
/* blocks */
.btn.base{width:100%;display:flex;justify-content:space-between;align-items:center;background:var(--acc);color:var(--ink);border:0;margin-bottom:10px;font-size:17px}
.blks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.blk{margin:0;display:flex;flex-direction:column;gap:10px;padding:12px}
.bn2{display:flex;gap:8px;align-items:center;text-align:left;min-height:46px}.bn2>span{font-size:28px}.bn2 small{display:block}.bn2 b{font-size:14px;line-height:1.15;display:block}
.stp{display:flex;align-items:center;justify-content:space-between;gap:4px}
.rb{width:48px;height:48px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);font-size:24px;font-weight:700;display:grid;place-items:center;flex:none;transition:transform .08s}
.rb.s{width:36px;height:36px;font-size:20px}
.gv{flex:1;text-align:center;font-size:14px;color:var(--mu);min-height:46px}.gv b{font-size:24px;color:var(--tx);font-variant-numeric:tabular-nums}
.bk{text-align:center;color:var(--mu);font-size:14px}.bk b{color:var(--tx);font-size:18px}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:48px;padding:0 14px;border-radius:15px;background:var(--s1);border:1px solid var(--bd);display:inline-flex;align-items:center;gap:6px;font-weight:600;position:relative;transition:transform .08s}
.chip b{color:var(--acc);font-variant-numeric:tabular-nums}
.chip.add{border-style:dashed;color:var(--mu)}
.chip.ed{border-color:var(--warn)}
.xx{position:absolute;top:-8px;right:-8px;width:24px;height:24px;border-radius:50%;background:var(--bad);color:#fff;display:grid;place-items:center;font-style:normal;font-size:15px}
/* entries */
.er{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--bd);min-height:56px}
.er:last-child{border:0}
.eic{font-size:22px;width:30px;text-align:center;flex:none}
.en{flex:1;min-width:0}.en b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev{font-weight:700;font-variant-numeric:tabular-nums}.ev.burn{color:var(--acc)}
.empty{color:var(--mu);text-align:center;padding:14px 0;font-size:14px}
.closed{display:flex;justify-content:space-between;align-items:center;gap:10px;border-color:rgba(52,211,153,.4)}
/* week */
.wkhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wkt{text-align:center}.wkt b{font-size:18px;display:block}
.chipst{display:inline-block;padding:5px 12px;border-radius:99px;background:var(--s2);font-size:13px;font-weight:700;margin-bottom:8px}
.chipst.ok{color:var(--ok)}.chipst.warn{color:var(--warn)}.chipst.bad{color:var(--bad)}
.bigbal{font-size:50px;font-weight:800;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.bigbal .sg{font-size:34px;margin-right:2px}
.goal{color:var(--mu);margin:2px 0 12px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.grid2 div{background:var(--s2);border-radius:14px;padding:10px 12px}.grid2 b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.wr{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 0;min-height:56px;border-bottom:1px solid var(--bd)}
.wr:last-child{border:0}
.wd{width:46px;font-weight:800;line-height:1.1}.wd small{display:block;font-weight:500}
.wbarw{flex:1}
.wv{width:70px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:15px}
.wv.lv{color:var(--mu);font-style:italic}
.wg{width:18px;text-align:center;font-weight:800}
.hrow{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:14px}
.hrow .hl{width:114px;white-space:nowrap;color:var(--mu);font-size:13px}.hrow .hb{flex:1}.hrow .hv{width:62px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* logros */
.rank{text-align:center}
.re{font-size:60px;line-height:1}
.rank h2{margin:2px 0 12px;font-size:28px}
.rs{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin-top:8px}
.nr{margin-top:12px;font-size:14px;background:var(--s2);border-radius:12px;padding:8px}
.streaks{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.streaks .card{margin:0;text-align:center}.streaks b{display:block;font-size:30px}
.medals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.medal{background:var(--s1);border:1px solid var(--bd);border-radius:18px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:128px;transition:transform .08s}
.medal .mi{font-size:34px;line-height:1}.medal b{font-size:12px;line-height:1.15}
.medal.off .mi{filter:grayscale(1);opacity:.35}.medal.off b{color:var(--mu)}
.medal.on{border-color:rgba(52,211,153,.5);background:linear-gradient(180deg,var(--s2),var(--s1))}
.medal .bar{width:80%}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sw{height:58px;border-radius:18px;line-height:1.15;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--ink);position:relative;border:3px solid transparent}
.sw.lock{opacity:.35;color:var(--tx);background:var(--s3)!important}
.sw.cur{border-color:#fff}
/* settings */
.sf{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bd)}
.sf:last-child{border:0}.sf b{display:block;font-size:15px}.sf small{display:block;max-width:190px}
.sfi{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px}
.inp{width:100%;height:52px;border-radius:14px;border:1px solid var(--bd);background:var(--s2);padding:0 14px;font-size:18px;outline:none}
.inp.sm{width:96px;height:46px;text-align:right}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:150px;padding:12px;font-size:16px}
.fl{display:block;margin:0 0 12px}.fl>span{display:block;font-size:12px;color:var(--mu);margin-bottom:6px;font-weight:600}
.chk{display:flex;align-items:center;gap:10px;margin:4px 0 10px;color:var(--mu);font-size:14px}.chk input{width:22px;height:22px;accent-color:var(--acc)}
.qk{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 12px}.qk .chip{min-height:42px}
.dplan{display:flex;gap:6px;margin-top:10px}.dplan button{flex:1;min-height:52px;border-radius:14px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;background:var(--s2)}
.dplan button.D{color:var(--blue);background:rgba(96,165,250,.14)}.dplan button.M{color:var(--vio);background:rgba(167,139,250,.14)}
.dplan button b{font-size:16px}
details.card p{margin-top:10px;color:var(--mu);font-size:14px}
.list{display:grid;gap:10px}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow:auto;background:var(--s1);border:1px solid var(--bd);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(40px);transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.ov.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:9px;background:var(--s3);margin:4px auto 14px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--s2);padding:5px;border-radius:16px;margin-bottom:14px}
.seg button{min-height:46px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mu)}
.seg button.on{background:var(--s3);color:var(--tx)}
.bp{display:none}.bp.on{display:block}
.kmrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}.kmrow .inp{text-align:center;font-weight:800;font-size:22px}
.plist{display:grid;gap:6px;margin-bottom:14px;max-height:240px;overflow:auto}
.pi{display:flex;justify-content:space-between;align-items:center;min-height:48px;padding:0 14px;border-radius:14px;background:var(--s2);border:1px solid var(--bd);text-align:left;font-size:15px}
.pi b{font-size:12px;color:var(--mu);font-weight:600}.pi.on{border-color:var(--acc)}
.cele{text-align:center;padding:6px 0 4px}
.cele .big:not(.btn){font-size:84px;line-height:1.05;animation:bump .6s cubic-bezier(.2,1.4,.4,1)}
.cele .tag{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);font-weight:800;margin-top:4px}
.cele h2{font-size:25px;margin:6px 0 8px}.cele p{color:var(--mu)}
.xpb{display:inline-block;background:var(--acc);color:var(--ink);font-weight:900;border-radius:99px;padding:6px 16px;margin:4px 0 14px}
.cele .kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}.cele .kv div{background:var(--s2);border-radius:14px;padding:10px}.cele .kv b{display:block;font-size:18px}
@keyframes bump{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
/* toast, fx */
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#0d1520;border:1px solid var(--bd);border-radius:16px;padding:12px 16px;display:flex;gap:14px;align-items:center;z-index:40;opacity:0;pointer-events:none;transition:.25s;width:max-content;max-width:calc(100vw - 28px);box-shadow:0 10px 30px rgba(0,0,0,.5);font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast button{color:var(--acc);font-weight:800;min-height:44px;padding:0 6px;pointer-events:auto}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}
.pop{position:fixed;font-weight:800;font-size:20px;color:var(--acc);pointer-events:none;z-index:60;animation:floatUp .9s ease-out forwards;text-shadow:0 2px 12px rgba(0,0,0,.7)}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,-30%)}to{opacity:0;transform:translate(-50%,-240%)}}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:rgba(10,14,20,.9);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs>div{display:flex;width:100%;max-width:520px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--mu);font-size:11px;font-weight:700}
.tb svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb.on{color:var(--acc)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main></div>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<canvas id="fx"></canvas>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
(()=>{
'use strict';
/* ================= constantes ================= */
const DOWL=['L','M','X','J','V','S','D'],DOW3=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],DOWF=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'],MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const RANKS=[{e:'🌱',n:'Recluta'},{e:'⚔️',n:'Aprendiz'},{e:'🗡️',n:'Explorador'},{e:'🛡️',n:'Guerrero'},{e:'🏹',n:'Centinela'},{e:'🔱',n:'Gladiador'},{e:'🏅',n:'Campeón'},{e:'🗿',n:'Titán'},{e:'🧙',n:'Maestro'},{e:'🐉',n:'Leyenda'},{e:'🌟',n:'Mítico'},{e:'👑',n:'Inmortal'}];
const THEMES=[{id:'emerald',n:'Esmeralda',c:'#34d399',lv:1},{id:'orange',n:'Naranja',c:'#fb923c',lv:2},{id:'cyan',n:'Cian',c:'#22d3ee',lv:3},{id:'violet',n:'Violeta',c:'#a78bfa',lv:5},{id:'rose',n:'Rosa',c:'#f472b6',lv:7},{id:'gold',n:'Oro',c:'#facc15',lv:9}];
const PROT=[['Pollo (pechuga)',120],['Pollo (muslo sin piel)',125],['Carne de res magra',150],['Carne molida magra',175],['Cerdo (lomo)',145],['Cerdo (cortes grasos)',250],['Pescado blanco',90],['Atún al natural',115]];
const CARB=[['Arroz (seco)',360],['Papa (cocida)',85],['Camote (cocido)',80],['Pasta (seca)',360],['Avena (seca)',380],['Pan',265],['Yuca / mandioca (cocida)',160]];
const ACH=[
{id:'first',ic:'📝',n:'Primer registro',d:'Contabiliza tu primer día.',g:1,v:s=>s.closed},

function defState(){return{v:1,settings:{tdee:2300,goal:5000,tol:150,floor:1200,burnPct:100,kcalKm:55,gymKcal:250,theme:'emerald',defPlan:'DDDDDMM',
 prot:{n:'Pollo (pechuga)',p:120,g:500},carb:{n:'Arroz (seco)',p:360,g:120},
 extras:[{id:'x1',n:'Helado',kcal:200,e:'🍦'},{id:'x2',n:'Churro',kcal:180,e:'🍩'},{id:'x3',n:'Pan',kcal:140,e:'🍞'},{id:'x4',n:'Cerveza',kcal:150,e:'🍺'},{id:'x5',n:'Pizza (porción)',kcal:285,e:'🍕'},{id:'x6',n:'Fruta',kcal:80,e:'🍎'}]},
 days:{},weeks:{},unlocked:{},seen:{sum:{},won:{}},lvl:1,lastExport:0}}
function sanitize(s){
 const d=defState();if(!s||typeof s!=='object')return d;
 s.settings=Object.assign({},d.settings,s.settings);
 s.settings.prot=Object.assign({},d.settings.prot,s.settings.prot);
 s.settings.carb=Object.assign({},d.settings.carb,s.settings.carb);
 ['prot','carb'].forEach(k=>{const b=s.settings[k];b.g=clamp(+b.g||0,0,5000);b.p=clamp(+b.p||0,0,900);b.n=String(b.n||'').slice(0,40)||d.settings[k].n});
 if(!Array.isArray(s.settings.extras))s.settings.extras=d.settings.extras;
 s.settings.extras=s.settings.extras.filter(x=>x&&isFinite(x.kcal)).map(x=>({id:x.id||uid(),n:String(x.n||'Extra').slice(0,40),kcal:Math.round(+x.kcal),e:x.e||'🍽️'}));
 Object.keys(LIM).forEach(k=>{const v=+s.settings[k];s.settings[k]=isFinite(v)?clamp(v,LIM[k][0],LIM[k][1]):d.settings[k]});
 if(!/^[DM]{7}$/.test(String(s.settings.defPlan)))s.settings.defPlan='DDDDDMM';
 s.days=s.days&&typeof s.days==='object'?s.days:{};
 Object.keys(s.days).forEach(k=>{
  if(!/^\d{4}-\d{2}-\d{2}$/.test(k)){delete s.days[k];return}
  const r=s.days[k]||{};
  r.e=(Array.isArray(r.e)?r.e:[]).filter(x=>x&&isFinite(x.kcal)).map(x=>Object.assign({},x,{id:x.id||uid(),kcal:Math.round(+x.kcal)}));
  r.b=(Array.isArray(r.b)?r.b:[]).filter(x=>x&&isFinite(x.kcal)).map(x=>Object.assign({},x,{id:x.id||uid(),kcal:Math.round(+x.kcal)}));
  r.closed=!!r.closed;if(r.base!=null)r.base=+r.base||s.settings.tdee;
  s.days[k]=r});
 s.weeks=s.weeks&&typeof s.weeks==='object'?s.weeks:{};
 Object.keys(s.weeks).forEach(k=>{const w=s.weeks[k];if(!w||!/^[DM]{7}$/.test(String(w.plan)))s.weeks[k]={plan:s.settings.defPlan,goal:s.settings.goal};else w.goal=clamp(+w.goal||s.settings.goal,LIM.goal[0],LIM.goal[1])});
 s.unlocked=s.unlocked&&typeof s.unlocked==='object'?s.unlocked:{};
 s.seen=Object.assign({sum:{},won:{}},s.seen);s.seen.sum=s.seen.sum||{};s.seen.won=s.seen.won||{};
 s.lvl=+s.lvl||1;s.lastExport=+s.lastExport||0;s.v=1;return s}
function load(){try{const r=localStorage.getItem(KEY);if(r)return sanitize(JSON.parse(r))}catch(e){}return defState()}

/* ================= cálculos ================= */
function weekRec(wk,create){let w=S.weeks[wk];if(!w){w={plan:S.settings.defPlan,goal:S.settings.goal};if(create)S.weeks[wk]=w}return w}
function dayRec(k,create){let r=S.days[k];if(!r&&create){r=S.days[k]={e:[],b:[],closed:false,base:S.settings.tdee}}return r||EMPTY}
function dayCalc(k,type,tD,T){
 const r=S.days[k]||EMPTY,st=S.settings;
 const intake=r.e.reduce((a,x)=>a+x.kcal,0),burnRaw=r.b.reduce((a,x)=>a+x.kcal,0),burn=Math.round(burnRaw*st.burnPct/100);
 const base=r.base!=null?r.base:st.tdee,expend=base+burn,net=expend-intake,target=type==='D'?tD:0,budget=expend-target;
 const has=r.e.length>0,isToday=k===T,future=k>T,past=k<T,counted=!future&&has&&(past||r.closed);
 let res=null;
 if(has){if(type==='D')res=intake<st.floor?'low':net>=target-25?'ok':net>=target*.6?'near':'miss';else res=net>=-st.tol?'ok':'miss'}
 const state=future?'future':!has?(isToday?'empty':'none'):counted?'done':'live';
 return{k,type,intake,burn,burnRaw,base,expend,net,target,budget,remaining:budget-intake,has,isToday,future,past,counted,res,state,rec:r}}
function wkInfo(wk){
 const w=weekRec(wk),T=today(),plan=w.plan,goal=w.goal,nD=[...plan].filter(c=>c==='D').length,tD=nD?goal/nD:0;
 const days=[];let banked=0,nC=0;
 for(let i=0;i<7;i++){const k=addD(wk,i),d=dayCalc(k,plan[i],tD,T);d.i=i;days.push(d);if(d.counted){banked+=d.net;nC++}}
 const live=days.find(d=>d.isToday&&d.has&&!d.counted),liveAdd=live?live.net:0;
 const rest=days.filter(d=>!d.counted&&d.k>=T),proj=banked+rest.reduce((a,d)=>a+d.target,0);
 const remD=rest.filter(d=>d.type==='D').length,need=goal-banked,ended=addD(wk,6)<T,won=goal>0&&banked>=goal-0.5;
 const status=won?'won':ended?'short':proj>=goal-25?'on':proj>=goal*.85?'close':'behind';
 return{wk,plan,nD,goal,tD,days,banked,nCounted:nC,liveAdd,projection:proj,remD,need,perDay:remD&&need>0?need/remD:null,ended,won,status,fatKg:banked/7700}}
function allWeeks(){
 const T=today(),cw=wstart(T),keys=Object.keys(S.days).filter(k=>k<=T&&S.days[k].e.length).sort();
 if(!keys.length)return[cw];const out=[];for(let w=wstart(keys[0]);w<=cw;w=addD(w,7))out.push(w);return out}
function computeDerived(){
 const T=today(),cw=wstart(T),order=allWeeks(),W={};
 const s={closed:0,defOk:0,maintOk:0,disaster:0,perfectW:0,wonW:0,bestStreak:0,logBest:0,walkKm:0,gym:0};
 let xp=0,run=0;
 order.forEach(wk=>{
  const w=wkInfo(wk);W[wk]=w;
  w.days.forEach(d=>{
   if(!d.counted)return;s.closed++;let x=20;
   if(d.type==='D'){if(d.res==='ok'){x+=60;s.defOk++}else if(d.res==='near')x+=25}
   else if(d.res==='ok'){x+=45;s.maintOk++;if(d.rec.e.filter(e=>e.k==='x').reduce((a,e)=>a+e.kcal,0)>=250)s.disaster++}
   xp+=x});
  const dd=w.days.filter(d=>d.type==='D');
  if(dd.length&&dd.every(d=>d.counted&&d.res==='ok'))s.perfectW++;
  if(w.won){run++;s.bestStreak=Math.max(s.bestStreak,run);s.wonW++;xp+=300+Math.min(run-1,9)*50}
  else if(wk!==cw)run=0});
 const keys=Object.keys(S.days).filter(k=>k<=T),has=new Set(keys.filter(k=>S.days[k].e.length));
 keys.forEach(k=>S.days[k].b.forEach(b=>{if(b.k==='walk')s.walkKm+=+b.km||0;if(b.k==='gym')s.gym++}));
 let rr=0,prev=null;[...has].sort().forEach(k=>{rr=(prev&&addD(prev,1)===k)?rr+1:1;prev=k;s.logBest=Math.max(s.logBest,rr)});
 let ls=0,c=has.has(T)?T:addD(T,-1);while(has.has(c)){ls++;c=addD(c,-1)}
 return{weeks:W,order,st:s,xp,streakNow:run,logNow:ls}}
const derived=()=>cache||(cache=computeDerived());
const cumXP=L=>75*L*(L-1);
function levelInfo(xp){let L=1;while(L<99&&xp>=cumXP(L+1))L++;const cur=cumXP(L),nxt=cumXP(L+1);return{L,cur,nxt,pct:(xp-cur)/(nxt-cur)*100,rank:RANKS[Math.min(L-1,RANKS.length-1)]}}
const xpTotal=()=>derived().xp+50*Object.keys(S.unlocked).length;
function reconcile(silent){
 const D=derived(),T=today(),cw=wstart(T);
 ACH.forEach(a=>{if(!S.unlocked[a.id]&&a.v(D.st)>=a.g){S.unlocked[a.id]=T;if(!silent)ui.q.push({t:'ach',id:a.id})}});
 const lv=levelInfo(xpTotal()).L;
 if(lv>S.lvl){if(!silent)ui.q.push({t:'lvl',L:lv});S.lvl=lv}
 const wc=D.weeks[cw];
 if(wc){if(wc.won){if(!S.seen.won[cw]){S.seen.won[cw]=1;if(!silent)ui.q.push({t:'won',wk:cw})}}else delete S.seen.won[cw]}
 let last=null;
 D.order.forEach(wk=>{if(wk===cw)return;if(!S.seen.sum[wk]){S.seen.sum[wk]=1;if(D.weeks[wk].nCounted>0)last=wk}});
 if(last&&!silent)ui.q.push({t:'sum',wk:last})}
function commit(silent){cache=null;reconcile(silent);save();render();pump()}

 if(gh!=null){const g=clamp(isFinite(gh)?gh:0,0,100);h+=`<i class="gh" data-bk="${key}g" data-to="${g}" style="width:${ui.bp[key+'g']??0}%"></i>`}
 return h+`<i data-bk="${key}" data-to="${p}" style="width:${ui.bp[key]??0}%"></i></div>`}
function ring(key,pct,tone){
 const C=326.73,p=clamp(isFinite(pct)?pct:0,0,1),prev=ui.rp[key]!=null?ui.rp[key]:0;
 return `<svg viewBox="0 0 120 120"><circle class="rg-bg" cx="60" cy="60" r="52" fill="none" stroke-width="11"/><circle class="rg ${tone}" data-rk="${key}" data-to="${p}" cx="60" cy="60" r="52" fill="none" stroke-width="11" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-prev)}"/></svg>`}
function countUp(){
 $$('[data-cn]').forEach(el=>{
  const key=el.dataset.cn,to=+el.dataset.to,from=ui.cp[key]!=null?ui.cp[key]:to;ui.cp[key]=to;
  if(from===to||reduced){el.textContent=fmt(to);return}
  const t0=performance.now();
  const step=t=>{const p=Math.min(1,(t-t0)/450),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1&&el.isConnected)requestAnimationFrame(step)};
  requestAnimationFrame(step)})}
function post(){
 $$('[data-bk]').forEach(el=>{void el.offsetWidth;el.style.width=el.dataset.to+'%';ui.bp[el.dataset.bk]=+el.dataset.to});
 $$('[data-rk]').forEach(el=>{void el.getBoundingClientRect();el.style.strokeDashoffset=326.73*(1-el.dataset.to);ui.rp[el.dataset.rk]=+el.dataset.to});
 countUp()}

 if(reduced)return;const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const acc=getComputedStyle(document.documentElement).getPropertyValue('--acc').trim()||'#34d399',cols=[acc,'#fbbf24','#60a5fa','#f472b6','#a78bfa','#ffffff'];

function celebrate(ev){

 if(ev.t==='day'){
  const M={D:{ok:['✅','¡Día de déficit cumplido!'],near:['🟡','Casi: buen día'],miss:['🔸','Día registrado'],low:['⚠️','Comiste muy poco']},M:{ok:['⚖️','Mantenimiento controlado'],miss:['🔸','Te pasaste del mantenimiento']}}[ev.type][ev.res];
  let msg='';
  if(ev.type==='D'){
   if(ev.res==='ok')msg=`Balance de hoy ${fmtS(-ev.net)} kcal (meta ${fmtS(-ev.target)}).`;
   else if(ev.res==='near')msg=`Balance ${fmtS(-ev.net)} de ${fmtS(-ev.target)}. Un poco menos y lo clavas.`;
   else if(ev.res==='low')msg=`Comiste ${fmt(ev.intake)} kcal, por debajo de tu mínimo (${fmt(st.floor)}). No suma XP de déficit: comer lo suficiente también es parte del plan.`;
   else msg=`Quedaste en ${fmtS(-ev.net)} de ${fmtS(-ev.target)}. No pasa nada: ${ev.perDay?`necesitas ~${fmt(ev.perDay)} por día de déficit para cerrar la semana.`:'ajusta lo que queda de semana.'}`}
  else{
   if(ev.res==='ok')msg=ev.dis>=250?`Desastre controlado: te diste ${fmt(ev.dis)} kcal en extras y seguiste dentro del presupuesto.`:`Balance ${fmtS(-ev.net)}: dentro de tu margen.`;
   else msg=`Quedaste ${fmtS(-ev.net)} kcal sobre tu gasto. Lo compensas en los días de déficit.`}
  openSheet(`<div class="cele"><div class="big">${M[0]}</div><div class="tag">Día cerrado</div><h2>${M[1]}</h2><p>${msg}</p>${ev.xp>0?`<div class="xpb">+${fmt(ev.xp)} XP</div>`:''}<div class="kv"><div><b>${fmtS(-ev.banked)}</b><small>semana</small></div><div><b>${fmtS(-ev.goal)}</b><small>meta</small></div></div><button class="btn pri big" data-a="close" data-primary>Continuar</button></div>`);
  if(ev.res==='ok')confetti(ev.type==='D'?110:70)}
 else if(ev.t==='ach'){
  const a=ACH.find(x=>x.id===ev.id);if(!a){pump();return}
  openSheet(`<div class="cele"><div class="big">${a.ic}</div><div class="tag">Medalla desbloqueada</div><h2>${a.n}</h2><p>${a.d}</p><div class="xpb">+50 XP</div><button class="btn pri big" data-a="close" data-primary>Genial</button></div>`);confetti(90)}
 else if(ev.t==='lvl'){
  const li=levelInfo(cumXP(ev.L)),th=THEMES.find(t=>t.lv===ev.L);
  openSheet(`<div class="cele"><div class="big">${li.rank.e}</div><div class="tag">¡Subiste de nivel!</div><h2>Nivel ${ev.L} · ${li.rank.n}</h2>${th?`<p>🎁 Desbloqueaste el color <b style="color:${th.c}">${th.n}</b>. Actívalo en Logros.</p>`:'<p>Sigue sumando XP para el siguiente rango.</p>'}<button class="btn pri big" data-a="close" data-primary>Seguir</button></div>`);confetti(160)}
 else if(ev.t==='won'){
  const w=D.weeks[ev.wk];
  openSheet(`<div class="cele"><div class="big">🏆</div><div class="tag">Semana ganada</div><h2>¡Meta semanal cumplida!</h2><p>Llegaste a ${fmtS(-w.banked)} de ${fmtS(-w.goal)} kcal.</p><div class="kv"><div><b>🔥 ${D.streakNow}</b><small>semanas de racha</small></div><div><b>${w.days.filter(d=>d.counted&&d.type==='D'&&d.res==='ok').length}/${w.nD}</b><small>días de déficit ok</small></div></div><button class="btn pri big" data-a="close" data-primary>Épico</button></div>`);confetti(220)}
 else if(ev.t==='sum'){

function updBurnNote(k){
 const n=$('#bnote');if(!n)return;const p=S.settings.burnPct;
 n.textContent=p<100?`Cuenta al ${p}%: +${fmt(Math.round(k*p/100))} kcal a tu gasto.`:'Se suma completo a tu gasto del día.'}
function curBurnKcal(){
 if(ui.bm==='gym')return Math.round(parseFloat($('#f-gk').value)||0);
 if(ui.bm==='walk')return Math.round((parseFloat($('#f-bkm').value)||0)*S.settings.kcalKm);
 return Math.round(parseFloat($('#f-ok').value)||0)}
function setBmode(m){
 ui.bm=m;$$('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));$$('.bp').forEach(p=>p.classList.toggle('on',p.id==='bp-'+m));updBurnNote(curBurnKcal())}
function blkCalc(){
 const g=parseFloat($('#f-g').value)||0,p=parseFloat($('#f-p').value)||0;
 $('#bcalc').textContent=`${g} g × ${p} kcal/100 g = ${fmt(g*p/100)} kcal`}

/* ================= acciones ================= */
const ACT={
 tab(el){ui.tab=el.dataset.t;if(ui.tab==='sem')ui.wk=wstart(ui.sel);render();window.scrollTo(0,0)},
 sel(el){ui.sel=el.dataset.k;render()},
 today(){ui.sel=today();render()},
 selWeek(el){

 toggleType(el){

 goDay(el){ui.sel=el.dataset.k;ui.tab='hoy';render();window.scrollTo(0,0)},
 wkNav(el){const n=addD(ui.wk,7*(+el.dataset.d));if(n>addD(wstart(today()),7))return;ui.wk=n;render()},
 savePlan(){S.settings.defPlan=weekRec(ui.wk).plan;save();toast('Plan guardado como base')},
 goBackup(){ui.tab='ajustes';render();window.scrollTo(0,0)},
 hideBackup(){ui.hideBackup=true;render()},
 addBlock(el,e){
  const kind=el.dataset.b,b=S.settings[kind==='p'?'prot':'carb'];

 addBase(el,e){addEntries([blockEntry('p'),blockEntry('c')],'Base completa',e)},
 addExtra(el,e){

 editX(){ui.editX=!ui.editX;render()},
 newExtra(){
  openSheet(`<h2>Extra rápido</h2><label class="fl"><span>Nombre</span><input id="f-n" class="inp" placeholder="Ej. Helado" maxlength="40" autocomplete="off"></label><label class="fl"><span>Calorías (kcal)</span><input id="f-k" class="inp" type="number" inputmode="numeric" min="0" max="5000" placeholder="200"></label><div class="qk">${[50,100,200,300,500].map(n=>`<button class="chip" data-a="kAdd" data-n="${n}">+${n}</button>`).join('')}</div><label class="chk"><input type="checkbox" id="f-s" checked> Guardar como atajo</label><div class="btns"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveExtra" data-primary>Añadir</button></div>`);
  setTimeout(()=>{const n=$('#f-n');n&&n.focus()},320)},
 kAdd(el){const f=$('#f-k');f.value=(parseInt(f.value)||0)+(+el.dataset.n)},
 saveExtra(){
  const n=($('#f-n').value.trim()||'Extra').slice(0,40),kc=Math.round(parseFloat($('#f-k').value));
  if(!(kc>0&&kc<=5000)){toast('Pon las calorías (1–5,000)');return}

 extraDef(el){
  const x=S.settings.extras.find(v=>v.id===el.dataset.id);if(!x)return;ui.ex=x.id;
  openSheet(`<h2>Editar atajo</h2><div class="two"><label class="fl"><span>Emoji</span><input id="f-e" class="inp" value="${esc(x.e||'🍽️')}" maxlength="4"></label><label class="fl"><span>Calorías</span><input id="f-k" class="inp" type="number" inputmode="numeric" value="${x.kcal}"></label></div><label class="fl"><span>Nombre</span><input id="f-n" class="inp" value="${esc(x.n)}" maxlength="40"></label><div class="btns"><button class="btn dng" data-a="delExtraDef" data-id="${x.id}">Eliminar</button><button class="btn pri" data-a="saveExtraDef" data-primary>Guardar</button></div>`)},

 delExtraDef(el){S.settings.extras=S.settings.extras.filter(v=>v.id!==el.dataset.id);save();if(ui.busy)closeSheet();render()},
 addGym(el,e){addBurn({k:'gym',n:'Musculación',kcal:S.settings.gymKcal},e)},
 burnSheet(el){
  const m=el.dataset.m||'walk';
  openSheet(`<h2>Movimiento</h2><div class="seg"><button data-a="bmode" data-m="gym">💪 Fuerza</button><button data-a="bmode" data-m="walk">🚶 Caminata</button><button data-a="bmode" data-m="other">🏃 Otro</button></div>
  <div class="bp" id="bp-gym"><label class="fl"><span>Calorías de la sesión (kcal)</span><input id="f-gk" class="inp" type="number" inputmode="numeric" value="${S.settings.gymKcal}" data-link="burn"></label></div>
  <div class="bp" id="bp-walk"><div class="kmrow"><button class="rb" data-hold="km" data-d="-1">−</button><input id="f-bkm" class="inp" type="number" inputmode="decimal" step="0.1" value="3" data-link="bkm"><button class="rb" data-hold="km" data-d="1">+</button></div><div class="qk">${[1,2,3,5,8].map(n=>`<button class="chip" data-a="kmq" data-n="${n}">${n} km</button>`).join('')}</div><p class="muted">≈ <b id="bkmk">${Math.round(3*S.settings.kcalKm)}</b> kcal (${S.settings.kcalKm} kcal/km)</p></div>
  <div class="bp" id="bp-other"><label class="fl"><span>Actividad</span><input id="f-on" class="inp" placeholder="Ej. Bici, fútbol" maxlength="40"></label><label class="fl"><span>Calorías (kcal)</span><input id="f-ok" class="inp" type="number" inputmode="numeric" placeholder="200" data-link="burn"></label></div>

  setBmode(m)},
 bmode(el){setBmode(el.dataset.m)},
 kmq(el){$('#f-bkm').value=el.dataset.n;updKm()},
 saveBurn(){
  const kc=curBurnKcal();if(!(kc>0&&kc<=5000)){toast('Pon las calorías o la distancia');return}

  if(ui.bm==='gym')it={k:'gym',n:'Musculación',kcal:kc};
  else if(ui.bm==='walk')it={k:'walk',n:'Caminata',km:Math.round((parseFloat($('#f-bkm').value)||0)*10)/10,kcal:kc};

 blockSheet(el){
  const kind=el.dataset.b;ui.blk=kind;const b=S.settings[kind==='p'?'prot':'carb'],list=kind==='p'?PROT:CARB;
  openSheet(`<h2>${kind==='p'?'🍗 Proteína base':'🍚 Carbohidrato base'}</h2><div class="plist">${list.map(([n,p])=>`<button class="pi ${n===b.n?'on':''}" data-a="pickFood" data-n="${esc(n)}" data-p="${p}"><span>${esc(n)}</span><b>${p} kcal/100 g</b></button>`).join('')}</div>
  <div class="two"><label class="fl"><span>Alimento</span><input id="f-n" class="inp" value="${esc(b.n)}" maxlength="40"></label><label class="fl"><span>kcal / 100 g</span><input id="f-p" class="inp" type="number" inputmode="decimal" value="${b.p}" data-link="blk"></label></div>
  <label class="fl"><span>Cantidad base (g)</span><input id="f-g" class="inp" type="number" inputmode="numeric" value="${b.g}" data-link="blk"></label>
  <p class="muted" id="bcalc"></p><p class="foot" style="text-align:left">Valores aproximados en crudo/seco. Ajústalos a tu etiqueta o tabla.</p><div class="btns"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="saveBlock" data-primary>Guardar</button></div>`);
  blkCalc();if(el.dataset.focus==='g')setTimeout(()=>{const g=$('#f-g');g&&(g.focus(),g.select())},320)},
 pickFood(el){$('#f-n').value=el.dataset.n;$('#f-p').value=el.dataset.p;$$('.pi').forEach(x=>x.classList.toggle('on',x===el));blkCalc()},
 saveBlock(){
  const b=S.settings[ui.blk==='p'?'prot':'carb'],g=Math.round(parseFloat($('#f-g').value)),p=parseFloat($('#f-p').value);
  if(!(g>=0&&g<=5000&&p>=0&&p<=900)){toast('Revisa los valores');return}
  b.n=($('#f-n').value.trim()||b.n).slice(0,40);b.p=p;b.g=g;save();closeSheet();render()},
 editEnt(el){
  const kind=el.dataset.k,id=el.dataset.id,it=dayRec(ui.sel)[kind].find(x=>x.id===id);if(!it)return;ui.ed={kind,id};
  const hasG=kind==='e'&&it.g!=null&&it.p,isW=kind==='b'&&it.k==='walk';
  openSheet(`<h2>Editar</h2><label class="fl"><span>Nombre</span><input id="f-n" class="inp" value="${esc(it.n)}" maxlength="40"></label>${hasG?`<label class="fl"><span>Cantidad (g)</span><input id="f-g" class="inp" type="number" inputmode="decimal" value="${it.g}" data-link="eg" data-p="${it.p}"></label>`:''}${isW?`<label class="fl"><span>Distancia (km)</span><input id="f-km" class="inp" type="number" inputmode="decimal" step="0.1" value="${it.km}" data-link="ekm"></label>`:''}<label class="fl"><span>Calorías (kcal)</span><input id="f-k" class="inp" type="number" inputmode="numeric" value="${it.kcal}"></label><div class="btns"><button class="btn dng" data-a="delEnt">Eliminar</button><button class="btn pri" data-a="saveEnt" data-primary>Guardar</button></div>`)},
 saveEnt(){
  const{kind,id}=ui.ed||{},it=dayRec(ui.sel)[kind]&&dayRec(ui.sel)[kind].find(x=>x.id===id);if(!it){closeSheet();return}
  const kc=Math.round(parseFloat($('#f-k').value));if(!isFinite(kc)||kc<0){toast('Calorías inválidas');return}
  snapshot(ui.sel);it.n=($('#f-n').value.trim()||it.n).slice(0,40);it.kcal=clamp(kc,0,9999);
  const g=$('#f-g');if(g)it.g=parseFloat(g.value)||0;const km=$('#f-km');if(km)it.km=parseFloat(km.value)||0;
  closeSheet();commit()},
 delEnt(){
  const{kind,id}=ui.ed||{},r=dayRec(ui.sel);if(!r[kind])return;
  snapshot(ui.sel);r[kind]=r[kind].filter(x=>x.id!==id);if(!r.e.length)r.closed=false;closeSheet();commit();toast('Eliminado',true)},
 undo(){
  const u=ui.undo;if(!u)return;if(u.rec)S.days[u.k]=u.rec;else delete S.days[u.k];ui.undo=null;hideToast();commit()},
 closeDay(){
  const k=today(),r=dayRec(k,true);
  if(!r.e.length){toast('Registra algo de comida primero');return}
  const xb=xpTotal();r.closed=true;cache=null;
  const W=wkInfo(wstart(k)),d=W.days[dowIdx(k)];
  ui.q.push({t:'day',k,res:d.res,type:d.type,net:d.net,target:d.target,intake:d.intake,xp:xpTotal()-xb,banked:W.banked,goal:W.goal,perDay:W.perDay,dis:r.e.filter(e=>e.k==='x').reduce((a,e)=>a+e.kcal,0)});
  commit()},
 reopen(){const r=dayRec(today());if(r.e){r.closed=false;commit()}},
 close(){closeSheet()},
 confirmOk(){const cb=ui.cb;ui.cb=null;closeSheet();cb&&cb()},
 achSheet(el){
  const a=ACH.find(x=>x.id===el.dataset.id);if(!a)return;const on=!!S.unlocked[a.id],v=Math.min(a.v(derived().st),a.g);
  openSheet(`<div class="cele"><div class="big" style="${on?'':'filter:grayscale(1);opacity:.4'}">${a.ic}</div><div class="tag">${on?'Desbloqueada · '+lab(S.unlocked[a.id]):'Bloqueada'}</div><h2>${a.n}</h2><p>${a.d}</p>${on?'<div class="xpb">+50 XP</div>':`<p><b>${Math.round(v*10)/10}</b> / ${a.g}</p>${bar('as',v/a.g*100)}`}<button class="btn big" data-a="close" data-primary>Cerrar</button></div>`);post()},
 theme(el){S.settings.theme=el.dataset.id;save();render()},
 defPlan(el){
  const p=S.settings.defPlan.split(''),i=+el.dataset.i;p[i]=p[i]==='D'?'M':'D';S.settings.defPlan=p.join('');save();render()},
 async exportFile(){
  const txt=JSON.stringify(S,null,2),name='deficit-5x2-'+today()+'.json';
  try{const f=new File([txt],name,{type:'application/json'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Respaldo 5×2'});S.lastExport=Date.now();save();toast('Respaldo listo');render();return}}
  catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();
  S.lastExport=Date.now();save();toast('Respaldo descargado');render()},
 async copyData(){
  const txt=JSON.stringify(S);
  try{await navigator.clipboard.writeText(txt);S.lastExport=Date.now();save();toast('Respaldo copiado al portapapeles');render();return}catch(e){}
  openSheet(`<h2>Copia manual</h2><p class="muted">Selecciona todo el texto y cópialo.</p><textarea class="inp" id="f-t" readonly>${esc(txt)}</textarea><div class="btns"><button class="btn pri" data-a="close">Listo</button></div>`);
  setTimeout(()=>{const t=$('#f-t');t&&(t.focus(),t.select())},300)},
 importFile(){$('#fi').click()},
 pasteImport(){
  openSheet(`<h2>Importar pegando</h2><p class="muted">Pega aquí el texto de tu respaldo (JSON).</p><textarea class="inp" id="f-t" placeholder='{"v":1,...}'></textarea><div class="btns"><button class="btn" data-a="close">Cancelar</button><button class="btn pri" data-a="doPaste" data-primary>Continuar</button></div>`)},
 doPaste(){const t=$('#f-t').value;closeSheet();setTimeout(()=>tryImport(t),300)},
 resetWeek(){
  const wk=wstart(ui.sel);
  confirmSheet({title:'¿Resetear esta semana?',text:`Borra los registros del ${lab(wk)} al ${lab(addD(wk,6))}. Guardo una copia por si te arrepientes.`,ok:'Resetear',danger:true,cb:()=>{
   backupPrev();for(let i=0;i<7;i++)delete S.days[addD(wk,i)];delete S.weeks[wk];delete S.seen.sum[wk];delete S.seen.won[wk];commit(true);toast('Semana reseteada')}})},
 resetAll(){
  openSheet(`<h2>Borrar todo</h2><p class="muted">Se elimina historial, XP y medallas. Guardo una copia del estado actual por si te arrepientes. Escribe <b>BORRAR</b> para confirmar.</p><input id="f-c" class="inp" placeholder="BORRAR" autocomplete="off"><div class="btns"><button class="btn" data-a="close">Cancelar</button><button class="btn dng" data-a="doResetAll" data-primary>Borrar</button></div>`)},
 doResetAll(){
  if($('#f-c').value.trim().toUpperCase()!=='BORRAR'){toast('Escribe BORRAR para confirmar');return}
  backupPrev();S=defState();cache=null;ui.sel=today();ui.wk=wstart(ui.sel);closeSheet();commit(true);toast('Datos borrados')},
 restorePrev(){
  let o=null;try{o=JSON.parse(localStorage.getItem(KEYPREV))}catch(e){}
  if(!o){toast('No hay estado anterior');return}
  confirmSheet({title:'¿Restaurar estado anterior?',text:'Vuelves a los datos que tenías antes del último reset o importación.',ok:'Restaurar',cb:()=>{
   const cur=JSON.stringify(S);S=sanitize(o);try{localStorage.setItem(KEYPREV,cur)}catch(e){}cache=null;commit(true);toast('Estado restaurado')}})}
};
function tryImport(txt){
 let o;try{o=JSON.parse(txt)}catch(e){toast('Ese texto no es un respaldo válido');return}
 if(!o||typeof o!=='object'||!o.days||typeof o.days!=='object'||!o.settings){toast('Ese texto no es un respaldo válido');return}
 const n=Object.keys(o.days).length;
 confirmSheet({title:'¿Importar respaldo?',text:`Reemplaza tus datos actuales por ${n} día(s) del respaldo. Guardo una copia de lo actual por si te arrepientes.`,ok:'Importar',cb:()=>{
  backupPrev();S=sanitize(o);cache=null;ui.sel=today();ui.wk=wstart(ui.sel);commit(true);toast('Respaldo importado')}})}

/* ================= eventos ================= */
document.addEventListener('click',e=>{
 const t=e.target;if(!t||!t.closest)return;
 const el=t.closest('[data-a]');if(!el)return;const f=ACT[el.dataset.a];if(f)f(el,e)});
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeSheet()});
$('#sheet').addEventListener('input',e=>{
 const t=e.target,l=t.dataset&&t.dataset.link;if(!l)return;
 if(l==='eg'){$('#f-k').value=Math.round((parseFloat(t.value)||0)*(+t.dataset.p)/100)}
 else if(l==='ekm'){$('#f-k').value=Math.round((parseFloat(t.value)||0)*S.settings.kcalKm)}
 else if(l==='blk')blkCalc();
 else if(l==='bkm')updKm();
 else if(l==='burn')updBurnNote(curBurnKcal())});
$('#sheet').addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.type!=='checkbox'){const b=$('[data-primary]',$('#sheet'));b&&b.click()}});
document.addEventListener('change',e=>{
 const el=e.target;if(!el.dataset||!el.dataset.s)return;
 const key=el.dataset.s;let v=parseFloat(String(el.value).replace(',','.'));
 if(!isFinite(v)){render();return}
 v=clamp(v,LIM[key][0],LIM[key][1]);S.settings[key]=v;
 if(key==='goal'){const w=S.weeks[wstart(today())];if(w)w.goal=v}
 if(key==='tdee'){const r=S.days[today()];if(r)r.base=v}
 commit()});
$('#fi').addEventListener('change',e=>{
 const f=e.target.files&&e.target.files[0];if(!f)return;
 const rd=new FileReader();rd.onload=()=>tryImport(String(rd.result));rd.readAsText(f);e.target.value=''});
let holdT=null,holdI=null;
const HOLD={blk(el){stepBlock(el.dataset.b,+el.dataset.d)},km(el){stepKm(+el.dataset.d)}};
function stopHold(){const was=holdT||holdI;clearTimeout(holdT);clearInterval(holdI);holdT=holdI=null;if(was)flushSave()}
document.addEventListener('pointerdown',e=>{
 const el=e.target&&e.target.closest&&e.target.closest('[data-hold]');if(!el)return;
 const f=HOLD[el.dataset.hold];if(!f)return;stopHold();haptic();f(el);
 holdT=setTimeout(()=>{holdI=setInterval(()=>f(el),75)},380)});
['pointerup','pointercancel','blur'].forEach(ev=>window.addEventListener(ev,stopHold));
window.addEventListener('pagehide',flushSave);
document.addEventListener('visibilitychange',()=>{
 if(document.visibilityState!=='visible'){flushSave();return}
 const t=today();if(t!==ui.t0){if(ui.sel===ui.t0)ui.sel=t;ui.t0=t;ui.wk=wstart(ui.sel)}
 cache=null;reconcile(false);save();render();pump()});

/* ================= PWA ================= */
function makeIcon(sz){
 const c=document.createElement('canvas');c.width=c.height=sz;const x=c.getContext('2d');
 x.fillStyle='#0a0e14';x.fillRect(0,0,sz,sz);
 x.lineWidth=sz*.075;x.lineCap='round';x.strokeStyle='#1d2a3c';x.beginPath();x.arc(sz/2,sz/2,sz*.33,0,Math.PI*2);x.stroke();
 x.strokeStyle='#34d399';x.beginPath();x.arc(sz/2,sz/2,sz*.33,-Math.PI/2,-Math.PI/2+Math.PI*1.4);x.stroke();
 x.fillStyle='#e9eef6';x.font='800 '+Math.round(sz*.27)+'px -apple-system,system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('5×2',sz/2,sz/2+sz*.01);
 return c.toDataURL('image/png')}
(function pwa(){
 try{
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l)};
  add('apple-touch-icon',makeIcon(180));add('icon',makeIcon(64));
  const man={name:'Déficit 5×2',short_name:'5×2',display:'standalone',orientation:'portrait',background_color:'#0a0e14',theme_color:'#0a0e14',start_url:location.href.split('#')[0].split('?')[0],icons:[{src:makeIcon(512),sizes:'512x512',type:'image/png',purpose:'any'}]};
  add('manifest',URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'})));
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
 }catch(e){}
})();

/* ================= arranque ================= */
applyTheme();cache=null;reconcile(false);save();render();pump();
})();
</script>
